<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>অফলাইন - হিসাব</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#4f6ef7">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    font-family: 'Hind Siliguri', Arial, sans-serif;
    background: linear-gradient(135deg, #4f6ef7, #6c8fff);
    min-height: 100vh; display: flex; align-items: center; justify-content: center;
    color: #fff; text-align: center; padding: 20px;
  }
  .card { background: rgba(255,255,255,0.15); backdrop-filter: blur(10px); border-radius: 24px; padding: 40px 30px; max-width: 320px; }
  .icon { font-size: 64px; margin-bottom: 20px; }
  h1 { font-size: 24px; font-weight: 800; margin-bottom: 10px; }
  p { font-size: 15px; opacity: 0.85; line-height: 1.6; margin-bottom: 24px; }
  .btn { background: #fff; color: #4f6ef7; border: none; border-radius: 14px; padding: 14px 28px; font-size: 16px; font-weight: 700; cursor: pointer; font-family: inherit; }
  .btn:active { transform: scale(0.97); }
</style>
</head>
<body>
  <div class="card">
    <div class="icon">📶</div>
    <h1>ইন্টারনেট নেই</h1>
    <p>আপনি এখন অফলাইনে আছেন। ইন্টারনেট সংযোগ দিন এবং আবার চেষ্টা করুন।</p>
    <p style="font-size:13px;opacity:0.7;margin-bottom:20px">ক্যাশ করা পেইজগুলো এখনও ব্যবহার করা যাবে।</p>
    <button class="btn" onclick="location.href='index.html'">🏠 হোমে যান</button>
  </div>
</body>
</html>

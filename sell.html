<!DOCTYPE html>
<html lang="bn">
<head>
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="হিসাব">
  <meta name="theme-color" content="#4f6ef7">
  <meta name="msapplication-TileColor" content="#4f6ef7">
  <meta name="msapplication-TileImage" content="icons/icon-144.png">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" sizes="152x152" href="icons/icon-152.png">
  <link rel="apple-touch-icon" sizes="144x144" href="icons/icon-144.png">
  <link rel="apple-touch-icon" sizes="128x128" href="icons/icon-128.png">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
  <link rel="icon" type="image/png" sizes="512x512" href="icons/icon-512.png">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>বিক্রয় করুন</title>
<link rel="stylesheet" href="shared-styles.css">
<style>
.product-grid { display:grid; grid-template-columns:1fr 1fr 1fr; gap:10px; margin-bottom:16px; }
.prod-card {
  background:var(--card); border:1.5px solid var(--border); border-radius:14px;
  padding:10px 8px; text-align:center; cursor:pointer; transition:0.15s; position:relative;
}
.prod-card:active { transform:scale(0.95); }
.prod-card.selected { border-color:var(--primary); background:#f0f4ff; box-shadow:0 0 0 2px rgba(79,110,247,0.2); }
.prod-card.out-of-stock { opacity:0.4; pointer-events:none; }
.prod-card img { width:56px; height:56px; object-fit:cover; border-radius:10px; margin-bottom:6px; }
.pname { font-size:12px; font-weight:700; color:var(--text); line-height:1.2; }
.pstock { font-size:11px; color:var(--muted); margin-top:2px; }
.pbadge { position:absolute; top:5px; right:5px; background:var(--primary); color:#fff; font-size:10px; font-weight:700; padding:2px 6px; border-radius:8px; }

.cart-item {
  background:var(--bg); border-radius:14px; padding:12px; margin-bottom:8px;
  display:flex; align-items:center; gap:10px;
}
.cart-img { width:44px; height:44px; object-fit:cover; border-radius:10px; flex-shrink:0; }
.ci-info { flex:1; }
.ci-name { font-size:14px; font-weight:700; }
.ci-meta { font-size:11px; color:var(--muted); margin-top:2px; }
.ci-profit { font-size:11px; color:var(--green); font-weight:600; margin-top:2px; }
.sell-price-input {
  background:var(--card); border:1.5px solid var(--border); border-radius:10px;
  padding:8px 10px; color:var(--text); font-family:'Hind Siliguri',sans-serif;
  font-size:14px; width:90px; text-align:right; font-weight:700;
}
.sell-price-input:focus { outline:none; border-color:var(--green); }
.remove-btn { background:var(--card); border:1.5px solid #fecaca; border-radius:10px; color:var(--red); width:32px; height:32px; cursor:pointer; font-size:14px; display:flex; align-items:center; justify-content:center; flex-shrink:0; }

.summary-card {
  background:linear-gradient(135deg,#4f6ef7,#6c8fff); border-radius:var(--radius);
  padding:18px; margin-bottom:14px; color:#fff;
}
.sum-row { display:flex; justify-content:space-between; font-size:14px; padding:5px 0; color:rgba(255,255,255,0.85); }
.sum-row.big { font-size:18px; font-weight:800; color:#fff; border-top:1px solid rgba(255,255,255,0.2); margin-top:8px; padding-top:12px; }
.sum-row.profit { color:#86efac; font-weight:700; }
</style>
</head>
<body>

<div class="page-header">
  <button class="back-btn" onclick="location.href='index.html'">←</button>
  <div>
    <h1>বিক্রয় পণ্য</h1>
    <div class="sub">পণ্য বাছাই করুন ও বিক্রয় করুন</div>
  </div>
</div>

<div class="main">
  <!-- Search -->
  <div class="card" style="padding:14px;margin-bottom:12px">
    <input type="text" placeholder="🔍 পণ্যের নাম দিয়ে খুঁজুন..." id="searchInput" oninput="filterProducts()" style="width:100%;background:var(--bg);border:1.5px solid var(--border);border-radius:12px;padding:12px 14px;color:var(--text);font-family:'Hind Siliguri',sans-serif;font-size:15px;outline:none">
  </div>

  <!-- Product Grid -->
  <div class="card" style="padding:14px">
    <div style="font-size:13px;font-weight:600;color:var(--muted);margin-bottom:12px;text-transform:uppercase;letter-spacing:0.5px;">পণ্য বাছাই করুন (বর্ণক্রম)</div>
    <div class="product-grid" id="productGrid"><div style="text-align:center;color:var(--muted);padding:20px;grid-column:span 3;font-size:14px">⏳ লোড হচ্ছে...</div></div>
  </div>

  <!-- Cart -->
  <div class="card" id="cartCard">
    <div class="card-title">🧺 কার্ট <span id="cartCount" style="background:var(--primary);color:#fff;padding:2px 8px;border-radius:8px;font-size:12px;font-weight:700;margin-left:4px">০</span></div>
    <div id="cartItems"><div class="empty-state" style="padding:20px"><p>পণ্য বাছাই করুন</p></div></div>
  </div>

  <!-- Customer -->
  <div class="card">
    <div class="card-title">👤 ক্রেতার তথ্য</div>
    <div class="input-group"><label>ক্রেতার নাম *</label><input type="text" id="custName" placeholder="নাম লিখুন"></div>
    <div class="input-group"><label>ফোন নাম্বার</label><input type="tel" id="custPhone" placeholder="01XXXXXXXXX"></div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">
      <div class="input-group"><label>মোট পণ্যের দাম</label><input type="number" id="totalAmount" readonly style="background:#f0fdf4;border-color:#86efac;color:var(--green);font-weight:700"></div>
      <div class="input-group"><label>নগদ টাকা (পেইড)</label><input type="number" id="cashPaid" placeholder="০" oninput="calcDue()"></div>
    </div>
  </div>

  <!-- Summary -->
  <div class="summary-card">
    <div class="sum-row profit">💰 মোট লাভ <span id="sumProfit">৳ ০</span></div>
    <div class="sum-row">নগদ পেইড <span id="sumCash">৳ ০</span></div>
    <div class="sum-row big">বাকি <span id="sumDue">৳ ০</span></div>
  </div>

  <button class="btn btn-success" onclick="completeSale()" id="saleBtn">✅ বিক্রয় সম্পন্ন করুন</button>
</div>

<div class="toast" id="toast"></div>
<nav class="bottom-nav">
  <a href="index.html" class="nav-item"><div class="nav-item-icon">🏠</div><div class="nav-item-label">হোম</div></a>
  <a href="sell.html" class="nav-item active"><div class="nav-item-icon">🛒</div><div class="nav-item-label">বিক্রয়</div><div class="nav-active-dot"></div></a>
  <a href="stock.html" class="nav-item"><div class="nav-item-icon">📦</div><div class="nav-item-label">স্টক</div></a>
  <a href="due-accounts.html" class="nav-item"><div class="nav-item-icon">💳</div><div class="nav-item-label">বাকি</div></a>
  <a href="reports.html" class="nav-item"><div class="nav-item-icon">📊</div><div class="nav-item-label">রিপোর্ট</div></a>
</nav>

<script type="module">
import { auth, requireAuth, userRef, get, set, push, update } from './firebase-config.js';
let allProducts={}, cart={};

function showToast(msg,type='success'){ const t=document.getElementById('toast'); t.textContent=msg; t.className=`toast show ${type}`; setTimeout(()=>t.className='toast',2500); }

let _uid='';
requireAuth((user)=>{ _uid=user.uid; loadProducts(); });
function loadProducts(){ get(userRef(_uid,'products')).then(snap=>{ allProducts=snap.val()||{}; window._allProducts=allProducts; renderProducts(allProducts); }); }

function renderProducts(products){
  const grid=document.getElementById('productGrid');
  const keys=Object.keys(products).sort((a,b)=>(products[a].name||'').localeCompare(products[b].name||'','bn'));
  if(!keys.length){grid.innerHTML='<div style="text-align:center;color:var(--muted);padding:20px;grid-column:span 3;font-size:14px">কোনো পণ্য নেই</div>';return;}
  grid.innerHTML=keys.map(k=>{
    const p=products[k],inCart=cart[k],out=(p.stock||0)<=0;
    return `<div class="prod-card ${inCart?'selected':''} ${out?'out-of-stock':''}" onclick="toggleCart('${k}')">
      ${inCart?`<div class="pbadge">${inCart.qty}</div>`:''}
      <img src="${p.imgUrl||'https://placehold.co/56x56/f0f4ff/8494b0?text=📦'}" onerror="this.src='https://placehold.co/56x56/f0f4ff/8494b0?text=📦'">
      <div class="pname">${p.name||''}</div>
      <div class="pstock">${out?'শেষ':p.stock+' পিস'}</div>
    </div>`;
  }).join('');
}
window.filterProducts=function(){ const q=document.getElementById('searchInput').value.toLowerCase(); if(!q){renderProducts(allProducts);return;} const f={}; Object.keys(allProducts).forEach(k=>{if((allProducts[k].name||'').toLowerCase().includes(q))f[k]=allProducts[k];}); renderProducts(f); };

window.toggleCart=function(id){ const p=allProducts[id]; if(!p)return; if(cart[id])delete cart[id]; else cart[id]={product:p,sellPrice:p.buyPrice||0,qty:1}; renderCart(); renderProducts(allProducts); };

function renderCart(){
  const items=document.getElementById('cartItems');
  const keys=Object.keys(cart);
  document.getElementById('cartCount').textContent=keys.length;
  if(!keys.length){items.innerHTML='<div class="empty-state" style="padding:20px"><p>কোনো পণ্য বাছাই করুন</p></div>';updateSummary();return;}
  items.innerHTML=keys.map(k=>{
    const item=cart[k],p=item.product;
    const profit=(item.sellPrice-(p.buyPrice||0))*item.qty;
    return `<div class="cart-item">
      <img class="cart-img" src="${p.imgUrl||'https://placehold.co/44x44/f0f4ff/8494b0?text=📦'}" onerror="this.src='https://placehold.co/44x44/f0f4ff/8494b0?text=📦'">
      <div class="ci-info">
        <div class="ci-name">${p.name}</div>
        <div class="ci-meta">ক্রয়: ৳${p.buyPrice} · পরিমাণ: <input type="number" value="${item.qty}" min="1" max="${p.stock}" onchange="updateQty('${k}',this.value)" style="width:44px;background:var(--card);border:1px solid var(--border);border-radius:6px;color:var(--text);padding:2px 4px;font-size:12px;text-align:center;font-family:inherit"></div>
        <div class="ci-profit">লাভ: ৳${profit.toFixed(0)} ${profit<0?'⚠️':''}</div>
      </div>
      <div style="display:flex;flex-direction:column;gap:6px;align-items:flex-end">
        <input class="sell-price-input" type="number" value="${item.sellPrice}" onchange="updateSellPrice('${k}',this.value)" title="বিক্রয় মূল্য">
        <div style="font-size:10px;color:var(--muted)">বিক্রয় মূল্য</div>
        <button class="remove-btn" onclick="removeFromCart('${k}')">✕</button>
      </div>
    </div>`;
  }).join('');
  updateSummary();
}
window.updateQty=function(id,val){ const maxStock=cart[id].product.stock||0; const qty=Math.min(Math.max(1,parseInt(val)||1),maxStock||1); cart[id].qty=qty; renderCart(); };
window.updateSellPrice=function(id,val){ cart[id].sellPrice=parseFloat(val)||0; renderCart(); };
window.removeFromCart=function(id){ delete cart[id]; renderCart(); renderProducts(allProducts); };

function updateSummary(){
  let ta=0,tp=0; Object.keys(cart).forEach(k=>{ const i=cart[k]; ta+=i.sellPrice*i.qty; tp+=(i.sellPrice-(i.product.buyPrice||0))*i.qty; });
  document.getElementById('totalAmount').value=ta.toFixed(0);
  document.getElementById('sumProfit').textContent='৳ '+tp.toFixed(0);
  calcDue();
}
window.calcDue=function(){
  const t=parseFloat(document.getElementById('totalAmount').value)||0;
  const c=parseFloat(document.getElementById('cashPaid').value)||0;
  document.getElementById('sumCash').textContent='৳ '+c.toFixed(0);
  document.getElementById('sumDue').textContent='৳ '+Math.max(0,t-c).toFixed(0);
};

window.completeSale=async function(){
  const custName=document.getElementById('custName').value.trim();
  const custPhone=document.getElementById('custPhone').value.trim();
  const totalAmount=parseFloat(document.getElementById('totalAmount').value)||0;
  const cashPaid=parseFloat(document.getElementById('cashPaid').value)||0;
  const due=Math.max(0,totalAmount-cashPaid);
  if(!custName){showToast('ক্রেতার নাম দিন!','error');return;}
  if(!Object.keys(cart).length){showToast('কোনো পণ্য বাছাই করুন!','error');return;}
  const btn=document.getElementById('saleBtn'); btn.innerHTML='<span class="spinner"></span>প্রক্রিয়া হচ্ছে...'; btn.disabled=true;
  try{
    let totalProfit=0; const items={};
    for(const k in cart){ const i=cart[k]; totalProfit+=(i.sellPrice-(i.product.buyPrice||0))*i.qty; items[k]={name:i.product.name,qty:i.qty,buyPrice:i.product.buyPrice,sellPrice:i.sellPrice}; await update(userRef(_uid,`products/${k}`),{stock:Math.max(0,(i.product.stock||0)-i.qty)}); }
    const bdNow = new Date(new Date().toLocaleString('en-US',{timeZone:'Asia/Dhaka'}));
    const bdISO = `${bdNow.getFullYear()}-${String(bdNow.getMonth()+1).padStart(2,'0')}-${String(bdNow.getDate()).padStart(2,'0')}T${String(bdNow.getHours()).padStart(2,'0')}:${String(bdNow.getMinutes()).padStart(2,'0')}:00+06:00`;
    const sr=push(userRef(_uid,'sales')); await set(sr,{customerName:custName,customerPhone:custPhone,items,totalAmount,cashPaid,due,profit:totalProfit,date:bdISO});
    for(const k in cart) allProducts[k].stock=Math.max(0,(allProducts[k].stock||0)-cart[k].qty);
    showToast('✅ বিক্রয় সফল হয়েছে!'); cart={};
    renderCart(); renderProducts(allProducts);
    document.getElementById('custName').value=''; document.getElementById('custPhone').value=''; document.getElementById('cashPaid').value=''; document.getElementById('totalAmount').value='';
  }catch(e){showToast('ত্রুটি হয়েছে!','error');}
  btn.innerHTML='✅ বিক্রয় সম্পন্ন করুন'; btn.disabled=false;
};
</script>
<script>
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("sw.js")
      .then(reg => console.log("[PWA] SW registered"))
      .catch(err => console.log("[PWA] SW error:", err));
  });
}
let _deferredPrompt;
window.addEventListener("beforeinstallprompt", (e) => {
  e.preventDefault(); _deferredPrompt = e;
  const btn = document.getElementById("installBtn");
  if (btn) btn.style.display = "flex";
});
window.addEventListener("appinstalled", () => {
  _deferredPrompt = null;
  const btn = document.getElementById("installBtn");
  if (btn) btn.style.display = "none";
});
window.installPWA = function() {
  if (_deferredPrompt) { _deferredPrompt.prompt(); _deferredPrompt.userChoice.then(() => { _deferredPrompt = null; }); }
};
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="bn">
<head>
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#4f6ef7">
  <link rel="manifest" href="manifest.json">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>লগইন - হিসাব</title>
  <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary:#4f6ef7; --bg:#f0f4ff; --card:#fff;
      --text:#1e2d4d; --muted:#8494b0; --border:#e8edf5;
      --green:#22c55e; --red:#ef4444; --radius:18px;
    }
    * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
    html, body { height:100%; }
    body {
      font-family:'Hind Siliguri',sans-serif;
      background:linear-gradient(160deg,#4f6ef7 0%,#6c8fff 50%,#a78bfa 100%);
      display:flex; align-items:center; justify-content:center;
      min-height:100vh; padding:20px;
    }
    .login-box {
      background:#fff; border-radius:28px; padding:36px 28px;
      width:100%; max-width:400px;
      box-shadow:0 20px 60px rgba(79,110,247,0.25);
    }
    .logo { text-align:center; margin-bottom:28px; }
    .logo-icon {
      width:72px; height:72px; background:linear-gradient(135deg,#4f6ef7,#6c8fff);
      border-radius:22px; margin:0 auto 14px; display:flex;
      align-items:center; justify-content:center; font-size:32px;
    }
    .logo-title { font-size:24px; font-weight:800; color:var(--text); }
    .logo-sub { font-size:13px; color:var(--muted); margin-top:4px; }

    .input-group { margin-bottom:16px; }
    .input-group label { font-size:13px; color:var(--muted); font-weight:600; display:block; margin-bottom:7px; }
    .input-group input {
      width:100%; background:var(--bg); border:1.5px solid var(--border);
      border-radius:14px; padding:14px 16px; color:var(--text);
      font-family:'Hind Siliguri',sans-serif; font-size:15px; transition:0.2s;
    }
    .input-group input:focus { outline:none; border-color:var(--primary); background:#fff; box-shadow:0 0 0 3px rgba(79,110,247,0.1); }

    .btn-login {
      width:100%; padding:16px; border-radius:14px; border:none;
      background:linear-gradient(135deg,#4f6ef7,#6c8fff); color:#fff;
      font-family:'Hind Siliguri',sans-serif; font-size:16px; font-weight:700;
      cursor:pointer; transition:0.15s; margin-top:8px;
      box-shadow:0 4px 15px rgba(79,110,247,0.35);
    }
    .btn-login:active { transform:scale(0.98); }
    .btn-login:disabled { opacity:0.7; cursor:not-allowed; }

    .error-msg {
      background:#fef2f2; border:1px solid #fecaca; border-radius:12px;
      padding:12px 16px; color:var(--red); font-size:14px; font-weight:600;
      margin-bottom:16px; display:none; text-align:center;
    }
    .spinner {
      display:inline-block; width:18px; height:18px;
      border:2px solid rgba(255,255,255,0.4); border-top-color:#fff;
      border-radius:50%; animation:spin 0.7s linear infinite;
      vertical-align:middle; margin-right:6px;
    }
    @keyframes spin { to { transform:rotate(360deg); } }

    .footer-note { text-align:center; font-size:12px; color:var(--muted); margin-top:20px; }
  </style>
</head>
<body>
  <div class="login-box">
    <div class="logo">
      <div class="logo-icon">📊</div>
      <div class="logo-title">হিসাব</div>
      <div class="logo-sub">ব্যবসায়িক ম্যানেজমেন্ট</div>
    </div>

    <div class="error-msg" id="errorMsg">❌ ইমেইল বা পাসওয়ার্ড ভুল!</div>

    <div class="input-group">
      <label>ইমেইল</label>
      <input type="email" id="email" placeholder="example@email.com" autocomplete="email">
    </div>
    <div class="input-group">
      <label>পাসওয়ার্ড</label>
      <input type="password" id="password" placeholder="••••••••" autocomplete="current-password">
    </div>

    <button class="btn-login" id="loginBtn" onclick="doLogin()">🔐 লগইন করুন</button>

    <div class="footer-note">শুধুমাত্র অনুমোদিত ব্যবহারকারী লগইন করতে পারবেন</div>
  </div>

<script type="module">
import { auth, signInWithEmailAndPassword, onAuthStateChanged } from './firebase-config.js';

// আগে থেকে লগইন থাকলে সরাসরি হোমে যাও
onAuthStateChanged(auth, (user) => {
  if (user) window.location.href = 'index.html';
});

window.doLogin = async function() {
  const email = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value;
  const btn = document.getElementById('loginBtn');
  const err = document.getElementById('errorMsg');

  if (!email || !password) {
    err.textContent = '❌ ইমেইল ও পাসওয়ার্ড দিন!';
    err.style.display = 'block'; return;
  }

  btn.innerHTML = '<span class="spinner"></span>লগইন হচ্ছে...';
  btn.disabled = true;
  err.style.display = 'none';

  try {
    await signInWithEmailAndPassword(auth, email, password);
    window.location.href = 'index.html';
  } catch(e) {
    const msgs = {
      'auth/invalid-email': '❌ ইমেইল সঠিক নয়!',
      'auth/user-not-found': '❌ এই ইমেইলে কোনো অ্যাকাউন্ট নেই!',
      'auth/wrong-password': '❌ পাসওয়ার্ড ভুল!',
      'auth/invalid-credential': '❌ ইমেইল বা পাসওয়ার্ড ভুল!',
      'auth/too-many-requests': '❌ অনেকবার চেষ্টা হয়েছে! কিছুক্ষণ পরে আবার চেষ্টা করুন।',
    };
    err.textContent = msgs[e.code] || '❌ লগইন ব্যর্থ হয়েছে!';
    err.style.display = 'block';
  }
  btn.innerHTML = '🔐 লগইন করুন';
  btn.disabled = false;
};

// Enter চাপলেও লগইন
document.getElementById('password').addEventListener('keydown', e => {
  if (e.key === 'Enter') window.doLogin();
});
</script>
</body>
</html>
